stages:
  - test

test:
  stage: test
  image: golang:latest
  variables:
    GOCACHE: /tmp/go-build-cache
    GOPATH: /tmp/go-cache
    GOTOOLCHAIN: local
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
    GIT_SUBMODULE_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
  before_script:
    # Go Cache
    - sh -c 'mount -t tmpfs tmpfs /tmp || exit 0'
    - mkdir -p $GOCACHE
    - mkdir -p $GOPATH/src
    # Link default GOPATH
    - rm -rf /go
    - ln -sf $GOPATH /go
  script:
    - go test ./... -v
